name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_cThyGv41kuMf1yGKz8oIIkhx
          VERCEL_PROJECT_ID: prj_4XOhpRBc1kLm6s028v5P1T0b9r3q
